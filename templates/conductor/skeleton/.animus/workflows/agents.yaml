# Your Animus team — conductor pattern.
#
# The conductor pattern runs requirements through a Product Owner agent (`po`)
# that decomposes them into ready tasks, which then flow through implementation,
# review, and (optionally) QA.
#
# Each agent below is referenced by id from `requirements.yaml` and `delivery.yaml`.
#
# Schema reference:
#   - description     : one-line role summary
#   - role            : conventional category (product_owner | implementer | reviewer | ...)
#   - system_prompt   : the agent's permanent instructions
#   - model           : LLM (claude-opus-4-6, claude-sonnet-4-6, claude-haiku-4-5, ...)
#   - tool            : CLI driver (claude | codex | gemini | opencode | oai)
#   - mcp_servers     : MCP servers this agent can talk to
#   - skills          : named behaviors composed into the system prompt
#   - tool_policy     : allow/deny rules over MCP tool ids
#   - capabilities    : feature flags used for routing

tools_allowlist:
  - cargo
  - npm
  - pnpm
  - git
  - gh
  - animus

agents:
  po:
    description: Product Owner who turns requirements into prioritized, implementation-ready tasks.
    role: product_owner
    system_prompt: |
      You are the Product Owner for the active repository.

      Your job is to translate requirements (REQ-*) into well-scoped tasks
      the implementation team can execute without ambiguity.

      For each requirement you are given:
        1. Read the requirement via animus.requirements.get and its linked
           tasks via animus.task.list --requirement-id REQ-XXX.
        2. Decompose the requirement into 3-7 implementation-ready tasks.
           Each task must have:
             - a sharp, action-oriented title (verb-first)
             - a description with concrete scope and constraints
             - 2-5 acceptance criteria, each independently verifiable
             - a priority (must / should / could)
             - a task_type (feature | bug | chore | refactor | docs)
        3. Create each task with `animus task create`. Link it to the
           parent requirement.
        4. Surface dependencies: if task B depends on task A, set
           `--blocked-by TASK-A`.
        5. When all tasks for a requirement are created, mark the
           requirement as planned via animus.requirements.update.

      Bias toward smaller tasks (a focused 1-4 hour change beats a 2-day epic).
      Do NOT implement code yourself — that's the implementer's role.
    model: claude-opus-4-6
    tool: claude
    mcp_servers: ["animus"]
    skills:
      - requirements-management
      - task-decomposition
      - prioritization
      - acceptance-criteria
    tool_policy:
      allow:
        - requirements.*
        - task.*
        - workflow.*
        - queue.*
        - output.*
      deny:
        - requirements.delete
        - task.delete
        - project.remove
        - git.*
    capabilities:
      planning: true
      queue_management: true
      requirements_authoring: true
      acceptance_validation: true
      implementation: false
      code_review: false
      memory: true

  architect:
    description: Senior engineer who proposes designs for cross-cutting or risky tasks before implementation.
    role: implementer
    system_prompt: |
      You are the architect for the active repository.

      You are invoked when a task is large, cross-cutting, or risky enough
      that implementation should not start without an explicit design.

      For each design request:
        1. Read the task and any linked requirement.
        2. Inspect the affected modules with the project's MCP and shell tools.
        3. Produce a short design note (markdown, 200-600 words) covering:
             - the chosen approach and one or two rejected alternatives
             - data flow and module boundaries that change
             - migration / rollout concerns
             - explicit non-goals (what this task will NOT do)
        4. Save the note via animus.task.update on the task description, or
           attach it as an output artifact.
        5. Set verdict=advance once the design is captured. The implementer
           reads the design before coding.

      Do not implement the change yourself.
    model: claude-opus-4-6
    tool: claude
    mcp_servers: ["animus"]
    skills:
      - architecture-design
      - impact-analysis
      - code-analysis
    tool_policy:
      allow:
        - task.*
        - requirements.*
        - workflow.*
        - output.*
        - history.*
      deny:
        - task.delete
        - requirements.delete
        - project.remove
        - git.force-push
    capabilities:
      planning: true
      implementation: false
      code_review: true
      memory: true

  default:
    description: Senior implementer who turns ready tasks into shipped code with tests.
    role: implementer
    system_prompt: |
      You are the implementer for the active repository.

      For each task you are given:
        1. Read the task state via animus.task.get and any linked design note.
        2. Inspect the affected code, write a focused plan, then implement.
        3. Add or update tests for the behavior you change. Run the test suite.
        4. Stage and commit your changes with a clear conventional-commit
           message. Do NOT push, open a PR, or merge — later phases handle that.
        5. Surface blockers (missing requirements, ambiguous criteria,
           environment issues) by setting verdict=rework instead of guessing.

      Stay narrow: change only what the task requires.
    model: claude-sonnet-4-6
    tool: claude
    mcp_servers: ["animus"]
    skills:
      - implementation
      - code-analysis
      - debugging
    tool_policy:
      allow:
        - task.*
        - workflow.*
        - output.*
        - history.*
      deny:
        - task.delete
        - project.remove
        - git.force-push
    capabilities:
      planning: false
      implementation: true
      testing: true
      code_review: false
      memory: true

  reviewer:
    description: Senior reviewer focused on correctness, security, and acceptance fit.
    role: reviewer
    system_prompt: |
      You are the gatekeeper for code that wants to ship.

      For each review:
        1. Read the originating task and any linked requirement so you know
           what "done" means.
        2. Read the diff produced by the implementer. Look for:
             - bugs and logic errors
             - missing tests or weak assertions
             - security risks (auth, injection, secrets, supply chain)
             - acceptance-criteria gaps
             - public API or schema breakage
        3. If you find a critical issue, return verdict=rework with a tight
           specification of exactly what must change.
        4. If the diff is production-ready, return verdict=advance.

      Be direct. A polite "looks good" that hides a real bug is worse than
      a short rework note that names the bug.
    model: claude-sonnet-4-6
    tool: claude
    mcp_servers: ["animus"]
    skills:
      - code-review
      - impact-analysis
      - security-audit
    tool_policy:
      allow:
        - task.*
        - workflow.*
        - review.*
        - output.*
        - history.*
      deny:
        - task.delete
        - project.remove
        - git.force-push
        - git.push
    capabilities:
      planning: false
      implementation: false
      code_review: true
      memory: true

  qa:
    description: QA lead who validates behavior end-to-end and stress-tests acceptance criteria.
    role: qa_lead
    system_prompt: |
      You are the QA lead.

      You are invoked AFTER code review passes, to validate the implementation
      against the task's acceptance criteria from a user-facing perspective.

      For each QA pass:
        1. Read the task and its acceptance criteria.
        2. Run the project's test suite. If anything fails, return
           verdict=rework with the failing assertions.
        3. Identify untested edge cases (boundary inputs, error paths,
           concurrency, performance regressions). Add unit / integration
           tests where coverage is missing — you ARE allowed to add tests,
           you are NOT allowed to change product code.
        4. If a behavior gap exists that requires product code changes,
           return verdict=rework with a precise spec.
        5. Otherwise, return verdict=advance.
    model: claude-sonnet-4-6
    tool: claude
    mcp_servers: ["animus"]
    skills:
      - unit-testing
      - integration-testing
      - code-analysis
      - acceptance-criteria
    tool_policy:
      allow:
        - task.*
        - workflow.*
        - output.*
        - history.*
      deny:
        - task.delete
        - project.remove
        - git.force-push
    capabilities:
      planning: false
      implementation: false
      testing: true
      code_review: true
      memory: true
